name: Translate Upstream Updates

on:
  workflow_run:
    # Запуск сразу после того, как оригинал доехал по цепочке мержей до ru.
    # Раньше здесь стоял "Sync Fork with Upstream", но тот доводит апстрим
    # только до main-upstream — переводить в этот момент ещё нечего.
    workflows: ["Merge Upstream"]
    types:
      - completed
  workflow_dispatch:

jobs:
  translate:
    runs-on: ubuntu-latest
    # Запускаем только если предыдущий шаг (синхронизация) завершился успешно.
    # Для ручного запуска (workflow_dispatch) проверки нет.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
      pull-requests: write # Позволяет GitHub CLI открывать PR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Скачиваем всю историю коммитов, чтобы git diff работал корректно

      # Пока предыдущий translate/sync-* PR не смержен в ru, маркер прогресса
      # не продвигается — новый прогон продиффит от той же точки и продублирует
      # уже переведённое. Поэтому просто ждём, пока предыдущий PR не разберут.
      - name: Check for an existing pending translation PR
        id: pending_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OPEN_PR=$(gh pr list --repo ${{ github.repository }} --base ru --state open --search "head:translate/sync-" --json number --jq '.[0].number // empty')
          if [ -n "$OPEN_PR" ]; then
            echo "Open translate/sync-* PR #$OPEN_PR is still unmerged — skipping this run to avoid duplicate work."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.pending_pr.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Инструмент живёт в отдельном репозитории и там же тестируется, поэтому
      # здесь он просто ставится по тегу. Тег, а не ветка: прогон должен быть
      # воспроизводимым.
      #
      # Откат — предыдущий тег, а НЕ .github/scripts/translator.py. Локальная
      # копия осталась от старого пайплайна и отстала от v0.3.0 на два бага,
      # каждый из которых теряет перевод: она не видит переименование главы
      # (статус R не проходит фильтр) и удаляет перевод следом за оригиналом,
      # переигрывая решение, принятое человеком при разрешении конфликта.
      - name: Install dependencies
        if: steps.pending_pr.outputs.skip != 'true'
        run: |
          pip install "mdtranslate[gemini] @ git+https://github.com/deliseev/mdtranslate@v0.3.0"

      # Инструмент коммитит каждый переведённый файл сам, поэтому ему нужна подпись.
      # Пуш работает без доп. токена: actions/checkout оставляет persist-credentials.
      - name: Configure git identity
        if: steps.pending_pr.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Переводит только изменившиеся куски, коммитит пофайлово и открывает
      # черновой PR на первом же коммите — работа не теряется, даже если
      # раннер убьют посередине.
      - name: Run translation
        if: steps.pending_pr.outputs.skip != 'true'
        timeout-minutes: 60
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          mdtranslate --config .github/translate-config.toml

      # Если переводить было нечего, скрипт всё равно продвигает маркер, но ветку
      # и PR не создаёт. Такие изменения коммитим прямо в ru — ревьюить нечего.
      - name: Commit state-only changes
        if: ${{ !cancelled() && steps.pending_pr.outputs.skip != 'true' }}
        run: |
          if [ "$(git rev-parse --abbrev-ref HEAD)" != "ru" ]; then
            echo "Translator published its own branch; nothing to do here."
          elif [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore: advance translation sync state"
            git push origin HEAD:ru
          else
            echo "No changes."
          fi
