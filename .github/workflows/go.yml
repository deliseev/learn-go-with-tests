name: Go

on:
  push:
    # main-ru — это звено, где код апстрима встречается с нашей локализацией.
    # Ловить поломку здесь дешевле, чем после того, как она доехала до ru.
    branches: [ ru, main-ru ]
  pull_request:
    branches: [ ru, main-ru ]
  release:
    types: [ published ]
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.25

    - name: Build
      run: ./build.sh

    - name: Build books
      run: ./build.books.sh

    - name: Get release
      id: get_release
      if: github.event_name == 'release' && github.event.action == 'published'
      uses: bruceadams/get-release@v1.3.2
      env:
        GITHUB_TOKEN: ${{ github.token }}

    - name: Attach generated epub upon release publish
      if: github.event_name == 'release' && github.event.action == 'published'
      with:
        upload_url: ${{ steps.get_release.outputs.upload_url }}
        asset_path: ./learn-go-with-tests.epub
        asset_name: learn-go-with-tests.epub
        asset_content_type: application/epub+zip
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ github.token }}

    - name: Attach generated PDF upon release publish
      if: github.event_name == 'release' && github.event.action == 'published'
      with:
        upload_url: ${{ steps.get_release.outputs.upload_url }}
        asset_path: ./learn-go-with-tests.pdf
        asset_name: learn-go-with-tests.pdf
        asset_content_type: application/pdf
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ github.token }}

