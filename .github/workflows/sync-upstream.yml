name: Sync Fork with Upstream

on:
  schedule:
    # Каждые 12 часов дёшево проверяем SHA апстрима (git ls-remote, без
    # клонирования). Тяжёлый синк запускается только если появился новый
    # коммит — см. джоб `check`.
    - cron: '0 */12 * * *'
  # Позволяет запускать синхронизацию вручную в один клик через сайт GitHub
  workflow_dispatch:

jobs:
  check:
    name: Check upstream for new commits
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - name: Get latest upstream commit
        id: upstream
        run: |
          SHA=$(git ls-remote https://github.com/quii/learn-go-with-tests main | cut -f1)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Get last synced commit
        id: last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(gh api "repos/${{ github.repository }}/contents/.github/upstream-sync-state.txt?ref=main-upstream" --jq '.content' 2>/dev/null | base64 -d | tr -d '[:space:]' || true)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Compare
        id: compare
        run: |
          if [ "${{ steps.upstream.outputs.sha }}" != "${{ steps.last.outputs.sha }}" ]; then
            echo "New upstream commit: ${{ steps.upstream.outputs.sha }} (last synced: ${{ steps.last.outputs.sha }})"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new upstream commits."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  sync:
    name: Mirror upstream into main-upstream
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Дает право обновлять ветку main-upstream

    steps:
      - name: Checkout main-upstream
        uses: actions/checkout@v4
        with:
          ref: main-upstream
          fetch-depth: 0

      # GITHUB_TOKEN никогда не имеет scope `workflow`, поэтому не может
      # обновлять файлы в .github/workflows/*. `gh repo sync` синкает всё
      # разом и падает, если апстрим менял воркфлоу. Синкаем всё, кроме
      # этой директории — свои воркфлоу-файлы просто оставляем как есть.
      - name: Mirror upstream (excluding .github/workflows)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote add upstream https://github.com/quii/learn-go-with-tests.git
          git fetch upstream main

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout upstream/main -- . ':(exclude).github/workflows'

          # `git checkout <дерево> -- .` умеет только добавлять и обновлять:
          # файла, удалённого в апстриме, он не касается, и тот остаётся в
          # зеркале навсегда. Удаляем такие файлы отдельным проходом.
          #
          # --diff-filter=A на направлении upstream→HEAD даёт ровно то, что
          # есть у нас и чего нет у апстрима.
          #
          # --no-renames здесь обязателен. Детектор переименований склеивает
          # пару «удалили старое, добавили новое» в один статус R, и файл под
          # старым именем в фильтр A уже не попадает — то есть переживает
          # синхронизацию и остаётся в зеркале навсегда. Здесь нужен именно
          # пофайловый взгляд; настоящие переименования отрабатывают ниже по
          # цепочке, в мержах main-upstream → main-ru → ru, где детектор,
          # наоборот, нужен и включён.
          #
          # -z/-0 обязателен: в апстриме есть имена с пробелами, например
          # «.gitbook/assets/clock (1).svg».
          git diff -z --no-renames --name-only --diff-filter=A upstream/main HEAD -- . \
            ':(exclude).github/workflows' \
            ':(exclude).github/upstream-sync-state.txt' \
            | xargs -0r git rm -q --

          # Отмечаем, до какого коммита апстрима синкнулись — по этому
          # маркеру джоб `check` в следующий раз дёшево поймёт, что новых
          # изменений нет, и пропустит тяжёлый checkout.
          git rev-parse upstream/main > .github/upstream-sync-state.txt
          git add .github/upstream-sync-state.txt

          if git diff --cached --quiet; then
            echo "Already up to date."
          else
            git commit -m "Mirror upstream ($(git rev-parse --short upstream/main)) into main-upstream, excluding .github/workflows"
            git push origin HEAD:main-upstream
          fi
